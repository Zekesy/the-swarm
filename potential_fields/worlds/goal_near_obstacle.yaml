# Goal non-reachable with obstacle nearby (GNRON): the goal sits inside
# a pillar's influence range, so repulsion stops the robot short of it.
world:
  height: 50
  width: 50
  step_time: 0.1
  sample_time: 0.1
  offset: [0, 0]
  collision_mode: 'unobstructed'

robot:
  - kinematics: {name: omni}
    shape: {name: circle, radius: 0.5}
    state: [8, 25, 0]
    goal: [40, 25, 0]
    goal_threshold: 0.3
    vel_max: [3.0, 3.0]
    vel_min: [-3.0, -3.0]
    color: royalblue
    behavior:
      name: potential-fields
      target_roles: obstacle
      velocity_max: 3.0
      attraction_gain: 1.0
      goal_distance_threshold: 5.0
      repulsion_gain: 20.0
      influence_range: 4.0
    plot:
      show_trajectory: true
      show_goal: true

obstacle:
  - number: 1
    distribution: {name: manual}
    state: [[42.5, 25, 0]]
    shape: {name: circle, radius: 1.5}
