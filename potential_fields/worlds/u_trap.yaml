# Local minimum: a U-shaped trap opening toward the robot.
# The goal is straight behind the U. The robot drives in and gets stuck
# where the walls' push cancels the goal's pull.
world:
  height: 50
  width: 50
  step_time: 0.1
  sample_time: 0.1
  offset: [0, 0]
  collision_mode: 'unobstructed'

robot:
  - kinematics: {name: omni}
    shape: {name: circle, radius: 0.5}
    state: [8, 25, 0]
    goal: [42, 25, 0]
    goal_threshold: 0.3
    vel_max: [3.0, 3.0]
    vel_min: [-3.0, -3.0]
    color: royalblue
    behavior:
      name: potential-fields
      target_roles: obstacle
      velocity_max: 3.0
      attraction_gain: 1.0
      goal_distance_threshold: 5.0
      repulsion_gain: 20.0
      influence_range: 4.0
    plot:
      show_trajectory: true
      show_goal: true

obstacle:
  - number: 3
    distribution: {name: manual}
    state: [[30, 25, 0], [25, 31, 0], [25, 19, 0]]
    shape:
      - {name: rectangle, length: 1.0, width: 13.0}   # back wall
      - {name: rectangle, length: 11.0, width: 1.0}   # top arm
      - {name: rectangle, length: 11.0, width: 1.0}   # bottom arm
